<!DOCTYPE html>

<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONOS — Уақыт өнері</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c878;
    --gold-dim: #8a6e30;
    --black: #080808;
    --deep: #0e0d0b;
    --charcoal: #1a1915;
    --warm-white: #f5f0e8;
    --cream: #ede8dc;
    --text-muted: #8a8070;
  }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
background: var(–black);
color: var(–warm-white);
font-family: ‘Raleway’, sans-serif;
font-weight: 300;
overflow-x: hidden;
cursor: none;
}

/* Custom cursor */
.cursor {
position: fixed;
width: 8px; height: 8px;
background: var(–gold);
border-radius: 50%;
pointer-events: none;
z-index: 9999;
transition: transform 0.1s ease;
transform: translate(-50%, -50%);
}
.cursor-ring {
position: fixed;
width: 36px; height: 36px;
border: 1px solid var(–gold-dim);
border-radius: 50%;
pointer-events: none;
z-index: 9998;
transition: transform 0.25s ease, width 0.3s, height 0.3s, border-color 0.3s;
transform: translate(-50%, -50%);
}
body:hover .cursor-ring.hover { width: 60px; height: 60px; border-color: var(–gold); }

/* NAV */
nav {
position: fixed;
top: 0; left: 0; right: 0;
z-index: 100;
padding: 28px 60px;
display: flex;
align-items: center;
justify-content: space-between;
background: linear-gradient(to bottom, rgba(8,8,8,0.95), transparent);
backdrop-filter: blur(2px);
}
.logo {
font-family: ‘Cinzel’, serif;
font-size: 1.4rem;
letter-spacing: 0.4em;
color: var(–gold);
text-decoration: none;
}
.logo span { color: var(–warm-white); }
.nav-links {
display: flex;
gap: 48px;
list-style: none;
}
.nav-links a {
font-family: ‘Raleway’, sans-serif;
font-weight: 200;
font-size: 0.75rem;
letter-spacing: 0.25em;
text-transform: uppercase;
color: var(–text-muted);
text-decoration: none;
transition: color 0.3s;
}
.nav-links a:hover { color: var(–gold); }
.nav-cart {
font-family: ‘Raleway’, sans-serif;
font-weight: 300;
font-size: 0.75rem;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(–gold);
border: 1px solid var(–gold-dim);
padding: 10px 24px;
text-decoration: none;
transition: all 0.3s;
}
.nav-cart:hover { background: var(–gold); color: var(–black); }

/* HERO */
.hero {
height: 100vh;
position: relative;
display: flex;
align-items: center;
overflow: hidden;
}
.hero-bg {
position: absolute;
inset: 0;
background:
radial-gradient(ellipse 60% 80% at 70% 50%, rgba(201,168,76,0.08) 0%, transparent 60%),
radial-gradient(ellipse 40% 60% at 20% 80%, rgba(201,168,76,0.05) 0%, transparent 50%),
var(–black);
}
.hero-grain {
position: absolute;
inset: 0;
opacity: 0.04;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 256 256’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘noise’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘4’ stitchTiles=‘stitch’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23noise)’/%3E%3C/svg%3E”);
background-size: 200px;
}
.hero-line {
position: absolute;
top: 50%;
left: 0; right: 0;
height: 1px;
background: linear-gradient(to right, transparent, var(–gold-dim), transparent);
opacity: 0.3;
}

.hero-content {
position: relative;
z-index: 2;
padding: 0 60px;
max-width: 700px;
animation: heroFadeIn 1.8s ease forwards;
}
@keyframes heroFadeIn {
from { opacity: 0; transform: translateY(40px); }
to { opacity: 1; transform: translateY(0); }
}

.hero-label {
font-family: ‘Raleway’, sans-serif;
font-size: 0.65rem;
letter-spacing: 0.5em;
text-transform: uppercase;
color: var(–gold);
margin-bottom: 28px;
display: flex;
align-items: center;
gap: 16px;
}
.hero-label::before {
content: ‘’;
display: block;
width: 40px;
height: 1px;
background: var(–gold);
}

.hero-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: clamp(4rem, 8vw, 7.5rem);
font-weight: 300;
line-height: 0.9;
margin-bottom: 32px;
}
.hero-title em {
font-style: italic;
color: var(–gold);
}
.hero-sub {
font-size: 0.8rem;
letter-spacing: 0.15em;
color: var(–text-muted);
max-width: 360px;
line-height: 2;
margin-bottom: 56px;
}
.hero-cta {
display: inline-flex;
align-items: center;
gap: 20px;
font-family: ‘Raleway’, sans-serif;
font-weight: 300;
font-size: 0.75rem;
letter-spacing: 0.3em;
text-transform: uppercase;
color: var(–warm-white);
text-decoration: none;
transition: all 0.4s;
}
.hero-cta .cta-line {
width: 60px; height: 1px;
background: var(–gold);
transition: width 0.4s;
}
.hero-cta:hover .cta-line { width: 100px; }
.hero-cta:hover { color: var(–gold); }

.hero-watch {
position: absolute;
right: -5%;
top: 50%;
transform: translateY(-50%);
width: 52vw;
max-width: 780px;
opacity: 0;
animation: watchReveal 2.2s ease 0.3s forwards;
}
@keyframes watchReveal {
from { opacity: 0; transform: translateY(-50%) translateX(60px) rotate(5deg); }
to { opacity: 1; transform: translateY(-50%) translateX(0) rotate(0deg); }
}

/* SVG Watch Face */
.watch-svg { width: 100%; height: auto; filter: drop-shadow(0 40px 80px rgba(201,168,76,0.2)); }

/* MARQUEE */
.marquee-section {
overflow: hidden;
border-top: 1px solid rgba(201,168,76,0.15);
border-bottom: 1px solid rgba(201,168,76,0.15);
padding: 20px 0;
background: var(–charcoal);
}
.marquee-track {
display: flex;
gap: 0;
animation: marquee 20s linear infinite;
white-space: nowrap;
}
@keyframes marquee {
from { transform: translateX(0); }
to { transform: translateX(-50%); }
}
.marquee-item {
font-family: ‘Cinzel’, serif;
font-size: 0.65rem;
letter-spacing: 0.4em;
text-transform: uppercase;
color: var(–gold-dim);
padding: 0 40px;
display: flex;
align-items: center;
gap: 40px;
}
.marquee-item::after {
content: ‘◆’;
color: var(–gold);
font-size: 0.5rem;
}

/* FEATURED */
.section { padding: 140px 60px; }
.section-header {
display: flex;
align-items: flex-end;
justify-content: space-between;
margin-bottom: 80px;
}
.section-label {
font-size: 0.65rem;
letter-spacing: 0.5em;
text-transform: uppercase;
color: var(–gold);
display: flex;
align-items: center;
gap: 16px;
margin-bottom: 16px;
}
.section-label::before {
content: ‘’;
width: 30px; height: 1px;
background: var(–gold);
display: block;
}
.section-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: clamp(2.5rem, 4vw, 4rem);
font-weight: 300;
line-height: 1.1;
}
.section-title em { font-style: italic; color: var(–gold); }
.view-all {
font-size: 0.7rem;
letter-spacing: 0.3em;
text-transform: uppercase;
color: var(–gold);
text-decoration: none;
border-bottom: 1px solid var(–gold-dim);
padding-bottom: 4px;
transition: all 0.3s;
white-space: nowrap;
margin-bottom: 8px;
}
.view-all:hover { color: var(–warm-white); border-color: var(–warm-white); }

.watches-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 2px;
}
.watch-card {
background: var(–charcoal);
position: relative;
overflow: hidden;
cursor: none;
group: true;
}
.watch-card:first-child { grid-row: span 2; }
.watch-visual {
aspect-ratio: 1;
position: relative;
overflow: hidden;
background: linear-gradient(135deg, #141210 0%, #1e1b15 50%, #0f0e0c 100%);
display: flex;
align-items: center;
justify-content: center;
}
.watch-card:first-child .watch-visual { aspect-ratio: unset; height: 100%; min-height: 500px; }
.watch-visual-inner {
transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
display: flex;
align-items: center;
justify-content: center;
}
.watch-card:hover .watch-visual-inner { transform: scale(1.06) rotate(3deg); }

.watch-glow {
position: absolute;
inset: 0;
background: radial-gradient(circle at 50% 50%, rgba(201,168,76,0.12), transparent 60%);
opacity: 0;
transition: opacity 0.5s;
}
.watch-card:hover .watch-glow { opacity: 1; }

.watch-info {
padding: 28px 32px 32px;
background: var(–charcoal);
border-top: 1px solid rgba(201,168,76,0.1);
}
.watch-brand {
font-size: 0.6rem;
letter-spacing: 0.4em;
text-transform: uppercase;
color: var(–gold);
margin-bottom: 8px;
}
.watch-name {
font-family: ‘Cormorant Garamond’, serif;
font-size: 1.4rem;
font-weight: 400;
margin-bottom: 6px;
}
.watch-desc {
font-size: 0.72rem;
color: var(–text-muted);
letter-spacing: 0.05em;
margin-bottom: 20px;
line-height: 1.7;
}
.watch-price-row {
display: flex;
align-items: center;
justify-content: space-between;
}
.watch-price {
font-family: ‘Cormorant Garamond’, serif;
font-size: 1.5rem;
font-weight: 300;
color: var(–gold);
}
.watch-price sup {
font-size: 0.8rem;
vertical-align: super;
margin-right: 2px;
}
.add-btn {
width: 44px; height: 44px;
border: 1px solid var(–gold-dim);
background: transparent;
color: var(–gold);
font-size: 1.3rem;
cursor: none;
transition: all 0.3s;
display: flex;
align-items: center;
justify-content: center;
}
.add-btn:hover { background: var(–gold); color: var(–black); }

/* PHILOSOPHY */
.philosophy {
padding: 160px 60px;
background: var(–charcoal);
position: relative;
overflow: hidden;
}
.philosophy-bg-text {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
font-family: ‘Cinzel’, serif;
font-size: clamp(6rem, 15vw, 18rem);
font-weight: 700;
color: transparent;
-webkit-text-stroke: 1px rgba(201,168,76,0.06);
white-space: nowrap;
pointer-events: none;
letter-spacing: 0.1em;
}
.philosophy-inner {
position: relative;
z-index: 2;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 100px;
align-items: center;
}
.philosophy-text .section-label { margin-bottom: 20px; }
.philosophy-quote {
font-family: ‘Cormorant Garamond’, serif;
font-size: clamp(1.8rem, 3vw, 2.8rem);
font-weight: 300;
font-style: italic;
line-height: 1.4;
color: var(–warm-white);
margin: 32px 0;
}
.philosophy-quote em { color: var(–gold); font-style: normal; }
.philosophy-body {
font-size: 0.8rem;
line-height: 2;
color: var(–text-muted);
max-width: 440px;
}
.stats-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 2px;
}
.stat-box {
background: rgba(201,168,76,0.05);
border: 1px solid rgba(201,168,76,0.12);
padding: 40px;
text-align: center;
transition: all 0.4s;
}
.stat-box:hover { background: rgba(201,168,76,0.1); border-color: var(–gold); }
.stat-number {
font-family: ‘Cormorant Garamond’, serif;
font-size: 3.5rem;
font-weight: 300;
color: var(–gold);
line-height: 1;
margin-bottom: 12px;
}
.stat-label {
font-size: 0.65rem;
letter-spacing: 0.3em;
text-transform: uppercase;
color: var(–text-muted);
}

/* COLLECTION BANNER */
.banner {
padding: 0 60px 140px;
position: relative;
}
.banner-inner {
background: linear-gradient(135deg, #1a1510 0%, #0e0d0b 40%, #1a1510 100%);
border: 1px solid rgba(201,168,76,0.2);
padding: 80px;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 60px;
align-items: center;
position: relative;
overflow: hidden;
}
.banner-inner::before {
content: ‘’;
position: absolute;
top: -50%; left: -50%;
width: 200%; height: 200%;
background: radial-gradient(ellipse at 30% 50%, rgba(201,168,76,0.06) 0%, transparent 50%);
pointer-events: none;
}
.banner-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: clamp(2rem, 3.5vw, 3.5rem);
font-weight: 300;
line-height: 1.1;
margin-bottom: 24px;
}
.banner-title em { font-style: italic; color: var(–gold); }
.banner-text {
font-size: 0.8rem;
color: var(–text-muted);
line-height: 2;
margin-bottom: 40px;
}
.gold-btn {
display: inline-flex;
align-items: center;
gap: 16px;
background: var(–gold);
color: var(–black);
font-family: ‘Raleway’, sans-serif;
font-weight: 400;
font-size: 0.7rem;
letter-spacing: 0.3em;
text-transform: uppercase;
padding: 18px 40px;
text-decoration: none;
transition: all 0.4s;
}
.gold-btn:hover { background: var(–gold-light); }
.banner-features {
display: flex;
flex-direction: column;
gap: 32px;
}
.feature-item {
display: flex;
align-items: flex-start;
gap: 24px;
padding-bottom: 32px;
border-bottom: 1px solid rgba(201,168,76,0.1);
}
.feature-item:last-child { border-bottom: none; padding-bottom: 0; }
.feature-icon {
width: 48px; height: 48px;
border: 1px solid rgba(201,168,76,0.3);
display: flex;
align-items: center;
justify-content: center;
color: var(–gold);
font-size: 1.2rem;
flex-shrink: 0;
margin-top: 2px;
}
.feature-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: 1.1rem;
margin-bottom: 8px;
}
.feature-desc {
font-size: 0.72rem;
color: var(–text-muted);
line-height: 1.8;
}

/* FOOTER */
footer {
background: var(–charcoal);
border-top: 1px solid rgba(201,168,76,0.15);
padding: 80px 60px 40px;
}
.footer-top {
display: grid;
grid-template-columns: 2fr 1fr 1fr 1fr;
gap: 60px;
margin-bottom: 60px;
}
.footer-brand .logo { font-size: 1.2rem; }
.footer-tagline {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
color: var(–text-muted);
margin-top: 16px;
font-size: 1rem;
line-height: 1.6;
}
.footer-col h4 {
font-family: ‘Cinzel’, serif;
font-size: 0.6rem;
letter-spacing: 0.4em;
text-transform: uppercase;
color: var(–gold);
margin-bottom: 24px;
}
.footer-col ul { list-style: none; }
.footer-col ul li { margin-bottom: 12px; }
.footer-col ul li a {
font-size: 0.75rem;
color: var(–text-muted);
text-decoration: none;
letter-spacing: 0.05em;
transition: color 0.3s;
}
.footer-col ul li a:hover { color: var(–gold); }
.footer-bottom {
border-top: 1px solid rgba(201,168,76,0.1);
padding-top: 32px;
display: flex;
justify-content: space-between;
align-items: center;
}
.footer-copy {
font-size: 0.7rem;
color: var(–text-muted);
letter-spacing: 0.1em;
}
.footer-socials {
display: flex;
gap: 24px;
}
.footer-socials a {
width: 36px; height: 36px;
border: 1px solid rgba(201,168,76,0.2);
display: flex;
align-items: center;
justify-content: center;
color: var(–text-muted);
font-size: 0.75rem;
text-decoration: none;
transition: all 0.3s;
font-family: ‘Cinzel’, serif;
letter-spacing: 0;
}
.footer-socials a:hover { border-color: var(–gold); color: var(–gold); }

/* Scroll reveal */
.reveal { opacity: 0; transform: translateY(30px); transition: all 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
.reveal.visible { opacity: 1; transform: translateY(0); }

@media (max-width: 1024px) {
nav { padding: 24px 32px; }
.nav-links { display: none; }
.section, .philosophy, .banner { padding: 80px 32px; }
.hero-content { padding: 0 32px; }
.hero-watch { display: none; }
.watches-grid { grid-template-columns: 1fr 1fr; }
.watch-card:first-child { grid-row: auto; }
.philosophy-inner { grid-template-columns: 1fr; gap: 60px; }
.banner-inner { grid-template-columns: 1fr; padding: 48px; }
.footer-top { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 640px) {
.watches-grid { grid-template-columns: 1fr; }
.stats-grid { grid-template-columns: 1fr 1fr; }
.footer-top { grid-template-columns: 1fr; }
.section-header { flex-direction: column; align-items: flex-start; gap: 24px; }
}
</style>

</head>
